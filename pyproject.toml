[project.urls]
Homepage = "https://github.com/Sijie-Yang/urbancode"
Documentation = "https://urbancode.readthedocs.io/"
"Bug Tracker" = "https://github.com/Sijie-Yang/urbancode/issues"
Changelog = "https://github.com/Sijie-Yang/urbancode/blob/main/CHANGELOG.md"

[project.scripts]
uc = "urbancode.cli:app"
urbancode = "urbancode.cli:app"

[tool.setuptools.dynamic]
version = { attr = "urbancode._version.__version__" }

[tool.setuptools.packages.find]
include = ["urbancode*"]
exclude = ["*.tests", "*.tests.*", "tests*", "docs*", "examples*"]

[tool.setuptools.package-data]
urbancode = [
    "streetview/data/tcis_manifest.json",
    "streetview/data/places365_manifest.json",
    "streetview/data/categories_places365.txt",
    "streetview/data/feature_stats.npz",
]

[tool.setuptools.exclude-package-data]
urbancode = ["streetview/data/*.pth", "streetview/data/*.pth.tar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: hits external APIs (deselect with -m 'not live')",
    "gallery_network: gallery cases that need urbancode[network]",
    "gallery_imagery: gallery cases that need urbancode[imagery]",
    "gallery_streetview: gallery cases that show street-view results",
    "gallery_svi: alias of gallery_streetview",
    "heavy: downloads weights or runs full TCIS inference",
]
addopts = "-m 'not live'"
