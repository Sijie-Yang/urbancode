name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

env:
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
  MPLBACKEND: Agg
  MPLCONFIGDIR: /tmp/urbancode-mpl

jobs:
  extras-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [core, standard, perception, svi, download]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fresh-env extra smoke
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.extra }}" = "core" ]; then
            pip install -e .
            python -c "import urbancode as uc; print(uc.__version__); print(uc.backends.available())"
            python -c "import sys; assert 'torch' not in sys.modules; assert 'geopandas' not in sys.modules"
          elif [ "${{ matrix.extra }}" = "download" ]; then
            pip install -e ".[download]"
            python -c "import urbancode as uc; print(uc.backends.info('streetlevel'))"
          elif [ "${{ matrix.extra }}" = "standard" ]; then
            pip install -e ".[standard]"
            python -c "import geopandas, osmnx, rasterio, pythermalcomfort, matplotlib"
            python -c "import urbancode as uc; print(uc.backends.status()['geopandas'])"
          elif [ "${{ matrix.extra }}" = "perception" ]; then
            pip install -e ".[perception]"
            python -c "import torch, transformers, PIL, cv2"
          else
            pip install -e ".[svi]"
            python -c "import torch, transformers, PIL, cv2"
            python -c "import importlib.util; assert importlib.util.find_spec('zensvi') is None"
          fi

  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core + dev
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Unit tests without extras
        run: |
          python -m pytest \
            tests/unit/test_city.py \
            tests/unit/test_city_contract.py \
            tests/unit/test_geocode.py \
            tests/unit/test_indices.py \
            tests/unit/test_cache.py \
            tests/unit/test_cli_version.py \
            tests/unit/test_comfort_contract.py \
            tests/unit/test_osm_specs.py \
            tests/unit/test_old_api.py \
            tests/unit/test_missing_extra.py \
            tests/unit/test_adapters.py \
            tests/unit/test_svi_fetch_mock.py \
            tests/unit/test_utci.py \
            tests/unit/test_stac_helpers.py \
            tests/unit/test_package_data.py \
            tests/unit/test_tcis_smoke.py \
            tests/unit/test_lazy_load.py \
            tests/unit/test_study_area.py \
            tests/unit/test_indicators.py \
            tests/unit/test_backends.py \
            tests/unit/test_climate_streetview.py \
            tests/unit/test_docs_streetview.py \
            tests/unit/test_capability_imports.py \
            tests/unit/test_public_api_catalog.py \
            tests/unit/test_workflow_docs.py \
            tests/unit/test_dataset_manifests.py \
            tests/integration/test_fetch_offline.py \
            -q --tb=short -o addopts=

  standard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install standard extra
        run: python -m pip install --upgrade pip && pip install -e ".[dev,standard]" opencv-python
      - name: All safe unit and integration tests
        run: |
          python -m pytest tests/unit tests/integration \
            -m "not live and not heavy" \
            -q --tb=short -o addopts=

  perception:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install perception extra
        run: python -m pip install --upgrade pip && pip install -e ".[dev,perception]"
      - name: Prove extras import
        run: python -c "import torch, transformers, PIL"
      - name: Perception and SVI contract tests
        env:
          UC_FAIL_ON_SKIP: "1"
        run: |
          python -m pytest \
            tests/unit/test_comfort_contract.py \
            tests/unit/test_color_features.py \
            tests/unit/test_perception.py \
            tests/unit/test_tcis_smoke.py \
            -q --tb=short -o addopts=

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install docs extra
        run: python -m pip install --upgrade pip && pip install -e ".[docs]"
      - name: Capabilities RST matches YAML
        run: python scripts/build_capabilities.py --check
      - name: Recipe RST matches catalog
        run: python scripts/build_recipe_rst.py --check
      - name: Figure checker
        run: python scripts/build_docs_examples.py --check --require-catalog
      - name: Sphinx HTML
        run: sphinx-build -W --keep-going -b html docs/source docs/build/html

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel and sdist
        run: python -m pip install --upgrade pip build && python -m build
      - name: Wheel and sdist must be small and weight-free
        run: python scripts/check_dist.py dist
      - name: Install wheel and smoke CLI
        run: |
          pip install dist/*.whl
          uc --version
          python -c "import urbancode as uc; import sys; assert 'torch' not in sys.modules"
      - uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  gallery-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install network + gallery
        run: python -m pip install --upgrade pip && pip install -e ".[dev,network,gallery]"
      - name: Vector and access gallery (no skip)
        env:
          UC_FAIL_ON_SKIP: "1"
        run: |
          python -m pytest \
            tests/gallery/test_docs_assets.py \
            tests/gallery/test_fixture_contract.py \
            tests/gallery/test_vector_gallery.py \
            tests/gallery/test_access_gallery.py \
            -m "gallery_network or not (gallery_imagery or gallery_streetview)" \
            -q --tb=short -o addopts=

  gallery-imagery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install imagery + gallery
        run: python -m pip install --upgrade pip && pip install -e ".[dev,network,imagery,gallery]"
      - name: Imagery gallery (no skip)
        env:
          UC_FAIL_ON_SKIP: "1"
        run: |
          python -m pytest \
            tests/gallery/test_docs_assets.py \
            tests/gallery/test_fixture_contract.py \
            tests/gallery/test_imagery_gallery.py \
            tests/gallery/test_tutorial_build.py \
            -m "gallery_imagery or not (gallery_network or gallery_streetview)" \
            -q --tb=short -o addopts=

  gallery-streetview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extras for streetview display gallery
        run: python -m pip install --upgrade pip && pip install -e ".[dev,network,imagery,gallery]"
      - name: Streetview gallery display only (no skip)
        env:
          UC_FAIL_ON_SKIP: "1"
        run: |
          python -m pytest \
            tests/gallery/test_docs_assets.py \
            tests/gallery/test_streetview_gallery.py \
            -m "gallery_streetview or not (gallery_network or gallery_imagery)" \
            -q --tb=short -o addopts=

  # Tier 2: weekly cron / manual. Street-view ML, STAC/OSM refresh, live fetch.
  live:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install extras for live APIs
        run: python -m pip install --upgrade pip && pip install -e ".[dev,network,imagery]"
      - name: Live small-bbox tests
        run: python -m pytest -m live -q --tb=short -o addopts=
