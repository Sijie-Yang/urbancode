# Publish to PyPI using OIDC (no long-lived token in the repo).
# Consumes the package artifact from a successful CI run on this commit.
name: Publish to PyPI

on:
  workflow_dispatch: {}
  release:
    types: [published]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Require a successful CI package job on this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=CI \
            --commit "${GITHUB_SHA}" \
            --json databaseId,conclusion,status \
            --jq '[.[] | select(.conclusion=="success")][0].databaseId // empty')
          if [ -z "${run_id}" ]; then
            echo "No successful CI run for ${GITHUB_SHA}. Merge to main and wait for CI."
            exit 1
          fi
          echo "run-id=${run_id}" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download CI package artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download "${{ needs.gate.outputs.run-id }}" \
            --repo "${{ github.repository }}" \
            --name python-package-distributions \
            --dir dist

      - name: Wheel and sdist must be small and weight-free
        run: python scripts/check_dist.py dist

      - name: Install wheel and check metadata
        run: |
          pip install --upgrade pip
          pip install dist/*.whl
          uc --version
          python - <<'PY'
          import importlib.metadata as md
          import urbancode as uc
          info = md.metadata("urbancode")
          assert info["Name"] == "urbancode"
          assert info["Version"] == uc.__version__
          extras = md.metadata("urbancode").get_all("Provides-Extra") or []
          for extra in ("standard", "perception", "svi", "download"):
              assert extra in extras, extra
          print("installed", info["Name"], info["Version"], "extras", extras)
          PY

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
